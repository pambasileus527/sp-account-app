# 手元の開発用。Pythonのサーバー(api)、画面(web)、偽メールサーバー(mailpit)を起動する。
#   docker compose up --build
#   アプリ:   http://localhost:3000   （画面。/api はサーバーへ中継される）
#   API文書:  http://localhost:8000/api/docs
#   受信箱:   http://localhost:8025   （確認コードのメールがここに届く）
services:
  api:
    build: ./backend
    command: ["uvicorn", "app.main:factory", "--factory", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-change-me}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-muscat.example}
      # 管理画面（/admin）に入れるアカウント（カンマ区切り。例: nanashi,admin2）。空なら管理画面は無効
      ADMIN_ADDRESSES: ${ADMIN_ADDRESSES:-}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      DB_FILE: /data/app.db
      DEBUG: "1"
    volumes:
      - appdata:/data
      # コードを書き換えたらすぐ反映されるように、ソースを重ねる
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - mailpit

  web:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm install --no-audit --no-fund && npm run dev"]
    environment:
      API_URL: http://api:8000
      VITE_POLLING: "1"
    volumes:
      - ./frontend:/app
      - web_modules:/app/node_modules
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:8025:8025"
    # SMTP(1025) はコンテナの中だけで使うので、外には出さない

volumes:
  appdata:
  web_modules:
